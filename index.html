<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryan Wolfslayer</title>
    <link rel="icon" href="favicon.ico">
    <script>
        // Apply a saved theme before first paint to avoid a flash.
        try {
            const saved = localStorage.getItem('theme');
            if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (e) {}
    </script>
    <style>
        :root {
            --text: #2e2e2e;
            --muted: #6e6e6e;
            --heading: #141414;
            --link: #1f5f8b;
            --border: #e3e3e0;
            --subtle: #f2f2ef;
            --bg: #fdfdfb;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --text: #d6d6d2;
                --muted: #9a9a95;
                --heading: #f2f2ee;
                --link: #7fb8e0;
                --border: #33332f;
                --subtle: #22221f;
                --bg: #171715;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --text: #d6d6d2;
            --muted: #9a9a95;
            --heading: #f2f2ee;
            --link: #7fb8e0;
            --border: #33332f;
            --subtle: #22221f;
            --bg: #171715;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 19px/1.7 Georgia, 'Times New Roman', serif;
        }

        .sans,
        .site-header,
        .meta,
        .back,
        .status,
        .article-body h2,
        .article-body h3,
        .article-body h4,
        .article-body th {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        a { color: var(--link); }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 16px 96px;
        }

        /* Header */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 48px;
            border-bottom: 1px solid var(--border);
        }

        .site-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--heading);
            text-decoration: none;
        }

        .theme-toggle {
            font: inherit;
            font-size: 14px;
            color: var(--muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .theme-toggle:hover { color: var(--heading); }

        /* Article list */
        .article-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .article-list li + li {
            margin-top: 40px;
        }

        .article-list h2 {
            margin: 0 0 4px;
            font-size: 26px;
            line-height: 1.25;
        }

        .article-list h2 a {
            color: var(--heading);
            text-decoration: none;
        }

        .article-list h2 a:hover { color: var(--link); }

        .article-list p { margin: 8px 0 0; }

        .meta {
            font-size: 14px;
            color: var(--muted);
        }

        .status {
            color: var(--muted);
            font-size: 16px;
        }

        /* Article view */
        .back {
            display: inline-block;
            margin-bottom: 32px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
        }

        .back:hover { color: var(--link); }

        .article-header {
            margin-bottom: 40px;
        }

        .article-header h1 {
            margin: 0 0 8px;
            font-size: 40px;
            line-height: 1.15;
            color: var(--heading);
        }

        .article-body h2,
        .article-body h3,
        .article-body h4 {
            color: var(--heading);
            line-height: 1.25;
            margin: 48px 0 12px;
        }

        .article-body h2 { font-size: 26px; }
        .article-body h3 { font-size: 21px; }

        .article-body p,
        .article-body ul,
        .article-body ol {
            margin: 0 0 1.4em;
        }

        .article-body li { margin-bottom: 8px; }

        .article-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 32px 0 12px;
            border-radius: 4px;
        }

        /* Caption: an italic line directly under an image */
        .article-body p > img + br { display: none; }

        .article-body p > img ~ em {
            display: block;
            font-size: 15px;
            line-height: 1.5;
            color: var(--muted);
        }

        .article-body blockquote {
            margin: 32px 0;
            padding-left: 20px;
            border-left: 3px solid var(--border);
            color: var(--muted);
        }

        .article-body code {
            font-size: 0.85em;
            padding: 2px 5px;
            background: var(--subtle);
            border-radius: 3px;
        }

        .article-body pre {
            padding: 16px;
            overflow-x: auto;
            background: var(--subtle);
            border-radius: 4px;
        }

        .article-body pre code { padding: 0; }

        .article-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 48px 0;
        }

        .article-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 32px 0;
        }

        .article-body th,
        .article-body td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            body { font-size: 18px; }
            .article-header h1 { font-size: 32px; }
            .article-list h2 { font-size: 23px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <a class="site-name" href="#">Ryan Wolfslayer</a>
            <button class="theme-toggle" id="themeToggle" type="button">Dark</button>
        </header>
        <main id="main">
            <p class="status">Loading…</p>
        </main>
        <noscript><p class="status">This site needs JavaScript to display articles.</p></noscript>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
    <script>
        const SITE_NAME = 'Ryan Wolfslayer';
        const main = document.getElementById('main');
        const themeToggle = document.getElementById('themeToggle');
        let articles = [];
        let renderId = 0;

        marked.use({ gfm: true, breaks: true });

        // Theme
        function currentTheme() {
            return document.documentElement.dataset.theme
                || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function updateThemeToggle() {
            themeToggle.textContent = currentTheme() === 'dark' ? 'Light' : 'Dark';
        }

        themeToggle.addEventListener('click', () => {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            updateThemeToggle();
        });

        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeToggle);
        updateThemeToggle();

        // Helpers
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        // Slugs come from titles, so renaming an article changes its URL.
        function slugify(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        function formatDate(isoDate) {
            return new Date(isoDate).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
            });
        }

        // Views
        function renderList() {
            document.title = SITE_NAME;
            main.innerHTML = `
                <ul class="article-list">
                    ${articles.map(article => `
                        <li>
                            <h2 class="sans"><a href="#article/${article.slug}">${escapeHtml(article.title)}</a></h2>
                            <time class="meta" datetime="${article.date}">${formatDate(article.date)}</time>
                            <p>${escapeHtml(article.excerpt)}</p>
                        </li>
                    `).join('')}
                </ul>
            `;
        }

        async function renderArticle(article) {
            const id = ++renderId;
            document.title = `${article.title} · ${SITE_NAME}`;
            main.innerHTML = '<p class="status">Loading…</p>';

            try {
                const response = await fetch(article.file);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();
                if (id !== renderId) return;

                const minutes = Math.max(1, Math.round(markdown.split(/\s+/).length / 200));
                main.innerHTML = `
                    <a class="back" href="#">← All articles</a>
                    <article>
                        <header class="article-header">
                            <h1 class="sans">${escapeHtml(article.title)}</h1>
                            <div class="meta">
                                <time datetime="${article.date}">${formatDate(article.date)}</time> · ${minutes} min read
                            </div>
                        </header>
                        <div class="article-body">${marked.parse(markdown)}</div>
                    </article>
                `;
            } catch (error) {
                if (id !== renderId) return;
                console.error(`Could not load ${article.file}:`, error);
                main.innerHTML = '<p class="status">Couldn’t load this article. <a href="#">Back to all articles</a></p>';
            }
        }

        // Routing: #article/<slug> shows an article; anything else shows the list.
        function route() {
            const match = location.hash.match(/^#article\/(.+)$/);
            const article = match && articles.find(a => a.slug === decodeURIComponent(match[1]));

            if (article) {
                renderArticle(article);
            } else {
                renderId++;
                renderList();
            }
            window.scrollTo(0, 0);
        }

        fetch('articles.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(list => {
                articles = list
                    .map(article => ({ ...article, slug: slugify(article.title) }))
                    .sort((a, b) => b.date.localeCompare(a.date));
                route();
                window.addEventListener('hashchange', route);
            })
            .catch(error => {
                console.error('Could not load articles.json:', error);
                main.innerHTML = '<p class="status">Couldn’t load the article list.</p>';
            });
    </script>
</body>
</html>
